<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>
<body>

    <nav class="sidebar">
        <div class="sidebar-logo">
            <div class="logo-mark">
                <span class="logo-title">OED Bank<span style="color: #1f5cd6;">...</span></span>
                <span class="logo-tag">Trust Grows With Us</span>
            </div>
            <i class="fa-solid fa-bars menu-icon"></i>
        </div>

        <div class="sidebar-profile">
            <img src="images/my picture.jpeg" alt="">
            <div>
                <div class="balance-label">AVAILABLE BALANCE</div>
                <div class="balance-amount">$495,554.00</div>
            </div>
        </div>

        <div class="sidebar-nav">

            <a class="nav-items active">
                <i class="fa-solid fa-table-colums icon-left"></i>
                <span class="item-label">Account Summary</span>
            </a>

            <ul class="nav-item">
                <i class="fa-solid fa-money-bill-transfer icon-left"></i>
                <li><a href="" class="item-label">Make Instant Transfer</a></li>
            </ul>

            <ul class="nav-item">
                <i class="fa-solid fa-file-invoice icon-left"></i>
                <li><a href="" class="item-label">Transaction Records</a></li>
            </ul>

            <a class="nav-item">
                <i class="fa-solid fa-users icon-left"></i>
                <span class="item-label">Account Beneficiaries</span>
            </a>
             
            <a class="nav-item">
                <i class="fa-solid fa-vault icon-left"></i>
                <span class="item-label">Make Deposit</span>
            </a>

            <a class="nav-item">
                <i class="fa-solid fa-file-circle-check icon-left"></i>
                <span class="item-label">Generate Invoice</span>
            </a>

            <div class="nav-divider"></div>

            <a class="nav-item">
                <i class="fa-solid fa-hand-holding-dollar icon-left"></i>
                <span class="item-label">Loan Application</span>
            </a>

            <a class="nav-item">
                <i class="fa-solid fa-file-invoice-dollar icon-left"></i>
                <span class="item-label">Bill Payment</span>
            </a>

            <a class="nav-item">
                <i class="fa-solid fa-user icon-left"></i>
                <span class="item-label">My Profile</span>
            </a>

            <a class="nav-item">
                <i class="fa-solid fa-gear icon-left"></i>
                <span class="item-label">Account Setting</span>
            </a>
        </div>

        <div class="sidebar-footer">
            <button class="signout-btn">
                <i class="fa-solid fa-person-running"></i>
                Sign Out
            </button>
        </div>
    </nav>

    <div class="container-nav">
        <div class="search-container">
            <span class="search-icon">&#128269;</span>
            <input type="text" placeholder="Search" class="search-input">
        </div>

        <div class="notification">
            <button class="notification-btn">
                <i class="fa-solid fa-bell"></i>
                <span class="badge">3</span>
            </button>
        </div>

        <div class="side-profile">
            <img src="images/my picture.jpeg" alt="">
            <div>
                <div class="my-name">Obioma David</div>
            </div>
        </div>
    </div>
</body>
</html>
